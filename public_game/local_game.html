<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public Blackjack — local inspector</title>
<style>body{font:18px system-ui;max-width:850px;margin:2rem auto;padding:1rem;background:#103d32;color:#fff}button,input{font:inherit;padding:.6rem;margin:.3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}.cards{display:flex;flex-wrap:wrap;gap:.65rem;margin:1rem 0}.card{background:#fff8ec;color:#182c27;border-radius:.6rem;min-width:3.4rem;padding:.6rem;min-height:5rem;display:grid;align-content:space-between;font-weight:700;font-size:1.4rem;box-shadow:0 3px 8px #0005}.card.red{color:#a51e35}.card.back{background:repeating-linear-gradient(45deg,#244c78,#244c78 5px,#1b3a60 5px,#1b3a60 10px);color:white;border:2px solid #fff8ec}.hand{padding:1rem;border:2px solid transparent;border-radius:1rem;background:#ffffff09;margin:.6rem 0}.hand.active{border-color:#e8c56a}h2,h3{margin:.3rem 0}#summary{font-weight:600}details{margin-top:2rem}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e8c56a}input{max-width:9rem}section{min-width:0}</style>
<h1>Public Blackjack — local inspector</h1><p>Virtual chips. One shared local session across tabs. No trained coach. This is a development view, not the finished game.</p>
<label>Wager in whole chips <input id="wager" type="number" min="1" step="1" value="10"></label>
<div id="actions"><button data-action="deal">Deal</button><button data-action="hit">Hit</button><button data-action="stand">Stand</button><button data-action="double">Double</button><button data-action="split">Split</button></div>
<button id="refresh">Refresh</button><p id="status" role="status" aria-live="polite"></p><p id="summary"></p><section aria-label="Blackjack table"><h2>Dealer</h2><div id="dealer" class="cards"></div><div id="hands"></div></section><details><summary>Inspect visible state</summary><pre id="state"></pre></details>
<script>
const token='__TOKEN__';let state=null,busy=false;
const status=document.querySelector('#status');
function drawCards(parent,cards){parent.replaceChildren();const suits={clubs:'♣',diamonds:'♦',hearts:'♥',spades:'♠'};cards.forEach(c=>{const el=document.createElement('div');el.className='card'+(!c?' back':['diamonds','hearts'].includes(c.suit)?' red':'');el.setAttribute('role','img');el.setAttribute('aria-label',c?c.rank+' of '+c.suit:'Hidden dealer card');el.textContent=c?c.rank+' '+suits[c.suit]:'?';parent.append(el);});}
function drawTable(){if(!state)return;document.querySelector('#summary').textContent='Balance: '+state.balance/2+' chips'+(state.profit===null?'':' · Round profit: '+state.profit/2+' chips · Normalized: '+state.normalized_profit);drawCards(document.querySelector('#dealer'),state.dealer);const parent=document.querySelector('#hands');parent.replaceChildren();state.hands.forEach((hand,i)=>{const box=document.createElement('section');box.className='hand'+(state.active_hand===i?' active':'');const title=document.createElement('h3');title.textContent='Hand '+(i+1)+(state.active_hand===i?' — your turn':'')+' · '+hand.stake/2+' chips'+(hand.outcome?' · '+hand.outcome:'');const cards=document.createElement('div');cards.className='cards';drawCards(cards,hand.cards);box.append(title,cards);parent.append(box);});}
function render(){drawTable();document.querySelector('#state').textContent=JSON.stringify(state,null,2);document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=busy||!state||(b.dataset.action==='deal'?state.phase==='player_turn':!state.legal_actions.includes(b.dataset.action));});document.querySelector('#refresh').disabled=busy;}
async function request(payload){busy=true;render();try{const response=await fetch(payload?'/command':'/state',payload?{method:'POST',headers:{'Content-Type':'application/json','X-Game-Token':token},body:JSON.stringify(payload)}:{});const data=await response.json();if(response.ok){state=data;status.textContent=payload?'Command accepted.':'State refreshed.';}else{if(data.state)state=data.state;status.textContent=data.error||'Request rejected.';}}catch(error){status.textContent='Connection failed. Refresh before trying again.';}finally{busy=false;render();}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(busy||!state)return;const payload={command:b.dataset.action,revision:state.revision};if(payload.command==='deal'){const chips=Number(document.querySelector('#wager').value);if(!Number.isSafeInteger(chips)||chips<=0||!Number.isSafeInteger(chips*2)){status.textContent='Enter a positive whole-chip wager.';return;}payload.stake=chips*2;}request(payload);});
document.querySelector('#refresh').onclick=()=>request();request();
</script></html>
